site_name: cutiepynb
site_description: Make your Jupyter notebooks pretty with custom colors and a table of contents.
site_author: emarquezz
site_url: https://emarquezz.github.io/cutiepynb
repo_url: https://github.com/emarquezz/cutiepynb

copyright: "Copyright &copy; 2024 Elisa Márquez-Zavala"

theme:
    palette:
        - scheme: default
          #   primary: blue
          #   accent: indigo
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
    name: material
    icon:
        repo: fontawesome/brands/github
    # logo: assets/logo.png
    # favicon: assets/favicon.png
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
    custom_dir: "docs/overrides"
    font:
        text: Google Sans
        code: Regular

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      show_source: true
    - mkdocs-jupyter:
          include_source: True
          ignore_h1_titles: True
          execute: false
          
markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - def_list
    - footnotes
    - meta
    - md_in_html
    - pymdownx.superfences
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

# extra:
#     analytics:
#         provider: google
#         property: UA-XXXXXXXXX-X

nav:
    - Home: index.md
    - Web App: webapp.md
    - Installation: installation.md
    - Tutorial: tutorial.md
    - Command and API: usage.md
    - API Reference: api.md
    - Contributing: contributing.md
    - FAQ: faq.md
    - Changelog: changelog.md
    - Examples:
        - Example Notebooks: examples/example_notebooks.md
        - Test Notebook: examples/Test.ipynb
    - Report Issues: https://github.com/emarquezz/cutiepynb/issues
