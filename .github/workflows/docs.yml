name: Documentation and web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip ".[docs]"
      - name: Test the browser helpers
        working-directory: web
        run: npm test
      - name: Build documentation
        run: mkdocs build --strict
      - name: Add the web app
        run: |
          mkdir -p site/app
          cp web/index.html web/styles.css web/app.js web/notebook.js web/transform.js web/worker.js site/app/
          cp web/favicon.svg web/logo.png web/og.png site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
